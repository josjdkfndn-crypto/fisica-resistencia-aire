<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Velocidad v(t) - Efecto GIF Animado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h2 { margin-bottom: 5px; color: #38bdf8; }
    p { color: #94a3b8; margin-top: 0; }
    #canvas-container {
      background: #1e293b;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <h2>Velocidad v(t) </h2>
  <p>Decaimiento exponencial por resistencia del aire: <i>F = -bv</i></p>

  <div id="canvas-container">
    <canvas id="gifCanvas" width="800" height="450"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gifCanvas');
    const ctx = canvas.getContext('2d');

    // Mismos parámetros físicos del sistema
    const v0 = 20.0;  // m/s
    const m = 2.0;    // kg
    const b = 0.5;    // kg/s

    const tau = m / b;   // 4.0 s
    const t_max = 18.0;  // Coincide con la escala visual

    // Márgenes y dimensiones
    const margin = { top: 50, right: 50, bottom: 60, left: 80 };
    const plotWidth = canvas.width - margin.left - margin.right;
    const plotHeight = canvas.height - margin.top - margin.bottom;

    let t_current = 0;
    let lastTime = null;

    // Conversión de física a píxeles
    function mapX(t) { return margin.left + (t / t_max) * plotWidth; }
    function mapY(v) { return (margin.top + plotHeight) - (v / (v0 * 1.15)) * plotHeight; }

    function render(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      // Avanza el tiempo y hace el bucle GIF
      t_current += dt * 2.5;
      if (t_current > t_max + 1.5) {
        t_current = 0;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Rejilla de Fondo
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;

      for (let i = 0; i <= 5; i++) {
        let t_val = (t_max / 5) * i;
        let x_px = mapX(t_val);
        ctx.beginPath(); ctx.moveTo(x_px, margin.top); ctx.lineTo(x_px, margin.top + plotHeight); ctx.stroke();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '12px Arial';
        ctx.fillText(`${t_val.toFixed(1)}s`, x_px - 10, margin.top + plotHeight + 20);
      }

      for (let i = 0; i <= 4; i++) {
        let v_val = (v0 / 4) * i;
        let y_px = mapY(v_val);
        ctx.beginPath(); ctx.moveTo(margin.left, y_px); ctx.lineTo(margin.left + plotWidth, y_px); ctx.stroke();
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`${v_val.toFixed(1)}m/s`, margin.left - 55, y_px + 4);
      }

      // Ejes Principales
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(margin.left, margin.top); ctx.lineTo(margin.left, margin.top + plotHeight);
      ctx.lineTo(margin.left + plotWidth, margin.top + plotHeight);
      ctx.stroke();

      // --- ETIQUETAS DE LOS EJES ---
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 13px Arial';
      
      // Nombre Eje Horizontal (Tiempo)
      ctx.fillText('Tiempo t (s)', margin.left + (plotWidth / 2) - 35, margin.top + plotHeight + 45);

      // Nombre Eje Vertical (Velocidad)
      ctx.save();
      ctx.translate(22, margin.top + (plotHeight / 2) + 40);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('Velocidad v(t) (m/s)', 0, 0);
      ctx.restore();

      // 2. Línea de Velocidad Inicial v0
      const v0_px = mapY(v0);
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(margin.left, v0_px);
      ctx.lineTo(margin.left + plotWidth, v0_px);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = 'bold 12px Arial';
      ctx.fillText(`v_0 = ${v0.toFixed(1)} m/s`, margin.left + 10, v0_px - 8);

      // 3. Trazado Animado de la Curva v(t)
      const t_draw = Math.min(t_current, t_max);
      
      if (t_draw > 0) {
        ctx.strokeStyle = '#38bdf8'; // Azul neón para la velocidad
        ctx.lineWidth = 4;
        ctx.beginPath();

        const steps = 200;
        for (let i = 0; i <= steps; i++) {
          let t_sim = (i / steps) * t_draw;
          let v_sim = v0 * Math.exp(-(b / m) * t_sim);

          let x_px = mapX(t_sim);
          let y_px = mapY(v_sim);

          if (i === 0) ctx.moveTo(x_px, y_px);
          else ctx.lineTo(x_px, y_px);
        }
        ctx.stroke();

        // 4. Cursor Amarillo
        let current_v = v0 * Math.exp(-(b / m) * t_draw);
        let headX = mapX(t_draw);
        let headY = mapY(current_v);

        ctx.beginPath();
        ctx.arc(headX, headY, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // 5. Lectura Digital
      let v_read = v0 * Math.exp(-(b / m) * t_draw);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.fillRect(margin.left + plotWidth - 225, margin.top + 15, 210, 65);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(margin.left + plotWidth - 225, margin.top + 15, 210, 65);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '13px Monospace';
      ctx.fillText(`t = ${t_draw.toFixed(2)} s`, margin.left + plotWidth - 215, margin.top + 38);
      ctx.fillText(`v = ${v_read.toFixed(2)} m/s`, margin.left + plotWidth - 215, margin.top + 58);

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
